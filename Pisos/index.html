<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semàfor LIB — Pisos</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e4e7;--muted:#9ca3af;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--pink:#ec4899;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:12px;max-width:900px;margin:0 auto;}
.hdr{text-align:center;padding:14px 0 10px;border-bottom:2px solid var(--border);margin-bottom:12px;}
.hdr h1{font-size:1.4em;margin-bottom:2px;}
.hdr p{color:var(--muted);font-size:.78em;}
.ver{font-size:.68em;color:#555;margin-top:2px;}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--border);}
.tab{padding:10px 20px;cursor:pointer;font-size:.9em;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s;user-select:none;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);}
.tab .cnt{background:var(--border);padding:1px 7px;border-radius:10px;font-size:.75em;margin-left:4px;}
.tab.on .cnt{background:rgba(59,130,246,.2);color:var(--blue);}
.tab.fav-tab .cnt{background:rgba(236,72,153,.15);color:var(--pink);}

/* Filters */
.fbar{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:end;border:1px solid var(--border);}
.fg{flex:1;min-width:100px;}
.fg label{font-size:.68em;color:var(--muted);display:block;margin-bottom:2px;}
.fg select,.fg input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.83em;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.stat{background:var(--card);border-radius:10px;padding:12px 6px;text-align:center;border:2px solid var(--border);cursor:pointer;transition:.2s;user-select:none;}
.stat:hover{border-color:var(--blue);}
.stat.on{border-color:var(--blue);background:rgba(59,130,246,.06);}
.stat .n{font-size:1.5em;font-weight:700;}
.stat .l{font-size:.68em;color:var(--muted);}

/* Cards */
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid var(--border);position:relative;}
.card.comprar{border-left-color:var(--green);}
.card.estudiar{border-left-color:var(--yellow);}
.card.passar{border-left-color:var(--red);}
.top-row{display:flex;justify-content:space-between;align-items:start;gap:8px;}
.badge{padding:3px 10px;border-radius:14px;font-size:.72em;font-weight:600;white-space:nowrap;}
.card.comprar .badge{background:rgba(34,197,94,.12);color:var(--green);}
.card.estudiar .badge{background:rgba(234,179,8,.12);color:var(--yellow);}
.card.passar .badge{background:rgba(239,68,68,.12);color:var(--red);}
.card h3{font-size:.93em;flex:1;}
.card .meta{color:var(--muted);font-size:.8em;margin:3px 0 8px;}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:6px;}
.met{background:rgba(255,255,255,.025);border-radius:5px;padding:5px 7px;}
.met .v{font-size:1em;font-weight:600;}
.met .v.ok{color:var(--green);}
.met .v.ko{color:var(--red);}
.met .k{font-size:.68em;color:var(--muted);}
.chks{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px;}
.chk{font-size:.72em;padding:1px 6px;border-radius:9px;}
.chk.p{background:rgba(34,197,94,.08);color:var(--green);}
.chk.f{background:rgba(239,68,68,.08);color:var(--red);}
.chk.w{background:rgba(234,179,8,.08);color:var(--yellow);}
.nt{font-size:.78em;color:var(--muted);margin-top:5px;padding-top:5px;border-top:1px solid var(--border);}
.lnk{display:inline-block;margin-top:5px;padding:4px 10px;border-radius:5px;text-decoration:none;font-size:.8em;font-weight:500;color:#fff;}
.lnk.idealista{background:#1daf17;}.lnk.fotocasa{background:#e7430a;}.lnk.bank{background:#4a5568;}
.zt{display:inline-block;padding:1px 6px;border-radius:7px;font-size:.68em;font-weight:600;margin-left:4px;}
.zt.bona{background:rgba(34,197,94,.12);color:var(--green);}
.zt.neutra{background:rgba(234,179,8,.12);color:var(--yellow);}
.zt.evitar{background:rgba(239,68,68,.12);color:var(--red);}
.ptag{display:inline-block;padding:1px 5px;border-radius:5px;font-size:.66em;background:rgba(255,255,255,.06);color:var(--muted);margin-left:3px;}

/* Heart / Fav */
.heart{background:none;border:none;cursor:pointer;font-size:1.3em;padding:2px 4px;transition:.15s;line-height:1;}
.heart:hover{transform:scale(1.2);}
.fav-date{font-size:.7em;color:var(--pink);margin-top:4px;}

.info{text-align:center;color:var(--muted);font-size:.74em;padding:12px 0;}
.empty{text-align:center;padding:30px;color:var(--muted);}

/* Confirm modal */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--card);border-radius:12px;padding:20px;max-width:340px;width:90%;border:1px solid var(--border);text-align:center;}
.modal p{margin-bottom:14px;font-size:.9em;}
.modal-btns{display:flex;gap:8px;justify-content:center;}
.modal-btns button{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:.85em;font-weight:500;}
.btn-yes{background:var(--pink);color:#fff;}
.btn-no{background:var(--border);color:var(--text);}

/* Upload petit */
.upsmall{text-align:center;margin:8px 0;font-size:.8em;color:var(--muted);}
.upsmall label{color:var(--blue);cursor:pointer;text-decoration:underline;}
.upsmall input{display:none;}

@media(max-width:600px){.mets{grid-template-columns:repeat(3,1fr);}.fbar{flex-direction:column;}.stats{grid-template-columns:repeat(2,1fr);}.tabs{overflow-x:auto;}}
</style>
</head>
<body>

<div class="hdr">
  <h1>🏠 Semàfor LIB</h1>
  <p>Mètode Libertad Inmobiliaria (Carlos Galán) · Cerca automàtica multi-portal</p>
  <div class="ver">v7.0 — 2026-11-21 · GitHub Actions</div>
</div>

<!-- Tabs -->
<div class="tabs">
  <div class="tab on" data-tab="pisos">🏠 Pisos <span class="cnt" id="cntPisos">0</span></div>
  <div class="tab fav-tab" data-tab="favorits">❤️ Favorits <span class="cnt" id="cntFavs">0</span></div>
</div>

<!-- Filters (pisos tab) -->
<div id="panelPisos">
  <div class="fbar">
    <div class="fg"><label>Ciutat</label><select id="fCiutat"><option value="">Totes</option></select></div>
    <div class="fg"><label>Preu mínim</label><input id="fPmin" type="number" placeholder="30000"></div>
    <div class="fg"><label>Preu màxim</label><input id="fPmax" type="number" placeholder="70000"></div>
    <div class="fg"><label>Habitacions</label><select id="fHabs"><option value="">Totes</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option></select></div>
    <div class="fg"><label>Portal</label><select id="fPortal"><option value="">Tots</option></select></div>
  </div>
  <div class="stats" id="statsBar"></div>
  <div id="results"></div>
  <div class="upsmall">
    <label for="fileInput">📂 Carregar JSON manualment</label>
    <input type="file" id="fileInput" accept=".json">
  </div>
  <div class="info" id="infoBar"></div>
</div>

<!-- Favorits tab -->
<div id="panelFavs" style="display:none;">
  <div id="favResults"></div>
  <div class="empty" id="favEmpty">Cap favorit guardat encara. Marca un pis amb ❤️</div>
</div>

<!-- Confirm modal -->
<div class="modal-bg" id="confirmModal" style="display:none;">
  <div class="modal">
    <p id="confirmText"></p>
    <div class="modal-btns">
      <button class="btn-no" onclick="closeConfirm(false)">Cancel·lar</button>
      <button class="btn-yes" onclick="closeConfirm(true)">Confirmar</button>
    </div>
  </div>
</div>

<script>
let allPisos=[], favs=[], currentSem='tots', currentTab='pisos';
let confirmCb=null;

const semLabel={comprar:'🟢 COMPRAR',estudiar:'🟡 ESTUDIAR',passar:'🔴 PASSAR'};
const allChecks={bruta:'Bruta ≥7%',neta:'Neta ≥4%',per:'PER ≤15',cf:'CF positiu',zona:'Zona bona'};

// ══ FAVORITS ═══════════════════════════════════════════════════════
function loadFavs(){ try{ favs=JSON.parse(localStorage.getItem('pisos_favs')||'[]'); }catch(e){favs=[];} }
function saveFavs(){ localStorage.setItem('pisos_favs',JSON.stringify(favs)); }
function isFav(url){ return favs.some(f=>f.url===url); }

function showConfirm(text){
  return new Promise(resolve=>{
    document.getElementById('confirmText').textContent=text;
    document.getElementById('confirmModal').style.display='flex';
    confirmCb=resolve;
  });
}
function closeConfirm(yes){
  document.getElementById('confirmModal').style.display='none';
  if(confirmCb) confirmCb(yes);
  confirmCb=null;
}

async function toggleFav(url){
  const p=allPisos.find(x=>x.url===url) || favs.find(x=>x.url===url);
  if(!p) return;
  
  if(isFav(url)){
    const ok=await showConfirm(`Treure "${p.nom}" dels favorits?`);
    if(!ok) return;
    favs=favs.filter(f=>f.url!==url);
  } else {
    const ok=await showConfirm(`Guardar "${p.nom}" com a favorit?`);
    if(!ok) return;
    favs.push({...p, favDate:new Date().toLocaleDateString('ca',{day:'numeric',month:'short',year:'numeric'})});
  }
  saveFavs();
  renderAll();
}

// ══ RENDER ══════════════════════════════════════════════════════════
function portalCls(p){p=p.toLowerCase();if(p==='idealista')return'idealista';if(p==='fotocasa')return'fotocasa';return'bank';}

function renderCard(p, showFavDate){
  const ch=Object.entries(allChecks).map(([k,v])=>{
    if(p.checks?.includes(k))return`<span class="chk p">✅ ${v}</span>`;
    if(k==='zona'&&p.zonaClass==='evitar')return`<span class="chk f">🔴 Zona evitar</span>`;
    if(k==='zona'&&p.zonaClass==='neutra')return`<span class="chk w">🟡 Zona neutra</span>`;
    return`<span class="chk f">❌ ${v}</span>`;
  }).join('');
  const faved=isFav(p.url);
  const heart=`<button class="heart" onclick="toggleFav('${p.url.replace(/'/g,"\\'")}')" title="${faved?'Treure de favorits':'Guardar com favorit'}">${faved?'❤️':'🤍'}</button>`;
  const urlBtn=p.url?`<a class="lnk ${portalCls(p.portal)}" href="${p.url}" target="_blank" rel="noopener">🔗 Veure a ${p.portal}</a>`:'';
  const favDateHtml=showFavDate&&p.favDate?`<div class="fav-date">❤️ Guardat: ${p.favDate}</div>`:'';
  
  return`<div class="card ${p.semfor}">
<div class="top-row">
  <h3>${p.nom}<span class="zt ${p.zonaClass||'neutra'}">${p.zona||p.ciutat}</span><span class="ptag">${p.portal}</span></h3>
  ${heart}
  <span class="badge">${semLabel[p.semfor]}</span>
</div>
<div class="meta">💰 ${p.preu?.toLocaleString('ca')}€ · ${p.habs}hab · ${p.m2}m² · Renda: ${p.renda}€/mes${p.alquilat?' · 🔑 Alquilat':''}</div>
<div class="mets">
  <div class="met"><div class="v ${p.bruta>=7?'ok':'ko'}">${p.bruta}%</div><div class="k">Rent. Bruta</div></div>
  <div class="met"><div class="v ${p.neta>=4?'ok':'ko'}">${p.neta}%</div><div class="k">Rent. Neta</div></div>
  <div class="met"><div class="v ${p.per<=15?'ok':'ko'}">${p.per}</div><div class="k">PER</div></div>
  <div class="met"><div class="v ${p.cf>=0?'ok':'ko'}">${p.cf>=0?'+':''}${p.cf}€</div><div class="k">CF/mes</div></div>
  <div class="met"><div class="v">${p.rentCap||p.rcap||0}%</div><div class="k">Rent/Cap</div></div>
  <div class="met"><div class="v">${p.quota}€</div><div class="k">Quota</div></div>
</div>
<div class="chks">${ch}</div>
${p.notes?`<div class="nt">📝 ${p.notes}</div>`:''}
${favDateHtml}
${urlBtn}
</div>`;
}

function renderAll(){
  loadFavs();
  document.getElementById('cntFavs').textContent=favs.length;
  document.getElementById('cntPisos').textContent=allPisos.length;
  
  if(currentTab==='pisos'){
    // Filter
    let ps=allPisos;
    const fC=document.getElementById('fCiutat').value;
    const fPn=parseInt(document.getElementById('fPmin').value)||0;
    const fPx=parseInt(document.getElementById('fPmax').value)||Infinity;
    const fH=parseInt(document.getElementById('fHabs').value)||0;
    const fPo=document.getElementById('fPortal').value;
    if(fC) ps=ps.filter(p=>p.ciutat===fC);
    if(fPn) ps=ps.filter(p=>p.preu>=fPn);
    if(fPx<Infinity) ps=ps.filter(p=>p.preu<=fPx);
    if(fH) ps=ps.filter(p=>p.habs>=fH);
    if(fPo) ps=ps.filter(p=>p.portal===fPo);
    if(currentSem!=='tots') ps=ps.filter(p=>p.semfor===currentSem);
    
    // Stats
    const nC=allPisos.filter(p=>p.semfor==='comprar').length;
    const nE=allPisos.filter(p=>p.semfor==='estudiar').length;
    const nP=allPisos.filter(p=>p.semfor==='passar').length;
    document.getElementById('statsBar').innerHTML=`
      <div class="stat ${currentSem==='tots'?'on':''}" data-s="tots"><div class="n">${allPisos.length}</div><div class="l">TOTS</div></div>
      <div class="stat ${currentSem==='comprar'?'on':''}" data-s="comprar"><div class="n" style="color:var(--green)">${nC}</div><div class="l">🟢 COMPRAR</div></div>
      <div class="stat ${currentSem==='estudiar'?'on':''}" data-s="estudiar"><div class="n" style="color:var(--yellow)">${nE}</div><div class="l">🟡 ESTUDIAR</div></div>
      <div class="stat ${currentSem==='passar'?'on':''}" data-s="passar"><div class="n" style="color:var(--red)">${nP}</div><div class="l">🔴 PASSAR</div></div>`;
    document.querySelectorAll('.stat').forEach(s=>s.addEventListener('click',()=>{currentSem=s.dataset.s;renderAll();}));
    
    document.getElementById('results').innerHTML=ps.length?ps.map(p=>renderCard(p,false)).join(''):'<div class="empty">Cap pis amb aquests filtres</div>';
  } else {
    // Favorits
    if(favs.length){
      document.getElementById('favResults').innerHTML=favs.map(p=>renderCard(p,true)).join('');
      document.getElementById('favEmpty').style.display='none';
    } else {
      document.getElementById('favResults').innerHTML='';
      document.getElementById('favEmpty').style.display='';
    }
  }
}

// ══ TABS ════════════════════════════════════════════════════════════
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    currentTab=t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===currentTab));
    document.getElementById('panelPisos').style.display=currentTab==='pisos'?'':'none';
    document.getElementById('panelFavs').style.display=currentTab==='favorits'?'':'none';
    renderAll();
  });
});

// ══ LOAD DATA ══════════════════════════════════════════════════════
function loadData(data){
  allPisos=data.pisos||[];
  
  // Populate filters
  const ciutats=[...new Set(allPisos.map(p=>p.ciutat))].sort();
  const portals=[...new Set(allPisos.map(p=>p.portal))].sort();
  document.getElementById('fCiutat').innerHTML='<option value="">Totes</option>'+ciutats.map(c=>`<option value="${c}">${c} (${allPisos.filter(x=>x.ciutat===c).length})</option>`).join('');
  document.getElementById('fPortal').innerHTML='<option value="">Tots</option>'+portals.map(p=>`<option value="${p}">${p} (${allPisos.filter(x=>x.portal===p).length})</option>`).join('');
  
  const cfg=data.config||{};
  document.getElementById('infoBar').innerHTML=`Última cerca: ${data.generatEl||'—'} · Ciutats: ${cfg.ciutats?.join(', ')||'—'} · ${(cfg.preuMin||30000).toLocaleString('ca')}–${(cfg.preuMax||70000).toLocaleString('ca')}€`;
  
  // Filter listeners
  document.querySelectorAll('.fbar select,.fbar input').forEach(el=>{
    el.addEventListener('change',renderAll);
    el.addEventListener('input',()=>{clearTimeout(el._t);el._t=setTimeout(renderAll,400);});
  });
  
  renderAll();
}

// ══ INIT ════════════════════════════════════════════════════════════
loadFavs();

document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{loadData(JSON.parse(ev.target.result));}catch(err){alert('Error: '+err.message);}};
  r.readAsText(f);
});

// Auto-load from data/
fetch('data/resultats_lib.json').then(r=>{if(r.ok)return r.json();throw'';}).then(d=>loadData(d)).catch(()=>{
  document.getElementById('results').innerHTML='<div class="empty">Esperant primera execució de GitHub Actions...<br>O carrega un JSON manualment.</div>';
});

// Show favs count on load
document.getElementById('cntFavs').textContent=favs.length;
</script>
</body>
</html>
